name: Weekly Research Digest

on:
  schedule:
    # 07:00 UTC every Monday = 07:00 London (winter/GMT) / 08:00 London (summer/BST)
    - cron: '0 7 * * 1'
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PRODUCTRESEARCHANTHROPICKEY }}
          RESEND_API_KEY: ${{ secrets.productresearchkey }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Commit updated seen.json
        run: |
          git config user.name "ws-research[bot]"
          git config user.email "ws-research[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "chore: update seen.json [skip ci]"
          git pull --rebase origin main
          git push
